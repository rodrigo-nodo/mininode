services:
  - type: web
    name: mininode-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PRIVACY_PRV103_SHADOW_ENABLED
        value: "true"
      - key: PRIVACY_PRV103_SHADOW_SAMPLE_RATE
        value: "0.05"
      - key: PRIVACY_PRV103_SHADOW_MAX_CALLS_PER_PROCESS
        value: "250"
    healthCheckPath: /health
    autoDeploy: true
