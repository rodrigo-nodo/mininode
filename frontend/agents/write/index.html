<!doctype html>
<html lang="es">
<head>

<body>
  <!-- Header (inyectado) -->
  <div id="site-header" data-include="../../partials/header-nav.html"></div>

  <main id="write-app" class="wr-container">
    <!-- Hero -->
    <section class="wr-hero wr-bordered">
      <div class="wr-hero__inner">

        <span class="wr-badge wr-badge--brand">Mininode Write</span>

    <!-- Panel -->
    <section class="wr-panel">
      <div class="wr-field">
        <label for="wr-texto">Input</label>
        <textarea id="wr-texto" class="wr-textarea" placeholder="Escribe tus esbozos o conceptosâ€¦"></textarea>
      </div>

      <div class="wr-grid">
        <div class="wr-field">
          <label for="wr-size">TamaÃ±o</label>

            <option value="micro">Micro</option>
            <option value="medio">Medio</option>
            <option value="largo">Largo</option>
          </select>
        </div>

        <div class="wr-field">
          <label for="wr-tone">Tono</label>
          <select id="wr-tone" class="wr-select">
            <option value="simple">Simple</option>
            <option value="formal">Formal</option>
            <option value="inspirador">Inspirador</option>
            <option value="tÃ©cnico">TÃ©cnico</option>
          </select>
        </div>
        <label class="wr-hidden" style="display:flex;align-items:center;gap:.5rem;margin:.25rem 0 0.25rem;">
          <input id="analyzeToggle" type="checkbox" />
          <span>Analizar URLs primero</span>
        </label>
        <p class="muted wr-hidden" id="urlInfo"></p>

        <!-- Idioma listo pero oculto en v1 -->
        <div class="wr-field wr-hidden">
          <label for="wr-lang">Idioma</label>
          <select id="wr-lang" class="wr-select">
            <option value="es" selected>EspaÃ±ol</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <div class="wr-actions">
        <div class="wr-hint">
          <span class="wr-dot"></span>
          <span class="wr-muted small">Listo para usar</span>
        </div>
        <div class="wr-row">
          <button id="wr-generate" class="wr-btn wr-btn--primary wr-btn--brand">Generar borrador</button>
          <!-- Avanzadas ocultas en v1 -->
          <button id="wr-advanced" class="wr-btn wr-hidden">Opciones avanzadas</button>
        </div>
      </div>

      <!-- Resultado -->
      <div id="wr-result-box" class="wr-result wr-hidden">
        <div class="wr-result__bar">
          <span class="wr-label">Resultado</span>
          <div class="wr-row">
            <button id="wr-copy" class="wr-btn">Copiar</button>
            <div class="wr-dropdown">
              <button id="wr-export" class="wr-btn">Exportar</button>
              <div class="wr-menu">
                <button data-export="txt">TXT (.txt)</button>
                <button data-export="md">Markdown (.md)</button>
                <!-- Hooks para futuro (DOCX/PDF nativos) -->
                <!-- <button data-export="docx">Word (.docx)</button>
                <button data-export="pdf">PDF (.pdf)</button> -->
              </div>
            </div>
          </div>
        </div>
        <pre id="wr-result" class="wr-pre"></pre>
      </div>

      <!-- Errores -->
      <p id="wr-error" class="wr-error wr-hidden"></p>
    </section>
  </main>

  <!-- Footer (inyectado) -->
  <div id="site-footer" data-include="../../partials/footer.html"></div>

  <!-- Env (dev/stg). En prod, usa env vars de Pages o Workers. -->

  <!-- JS (mÃ³dulos reutilizables + pÃ¡gina) -->
