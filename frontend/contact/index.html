<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Mininode</title>
  <meta name="description" content="Escríbenos para iniciar tu proyecto.">
  <link rel="stylesheet" href="../styles.css">
  <script src="../assets/js/core-head.js" defer></script>
  <script src="../include.js" defer></script>
</head>
<body>
<div data-include="../partials/header-nav.html"></div>
<main>
  <section class="container doc">
    <h1>Contacto</h1>
    <p class="contact-context" id="contactContext" hidden>Consulta sobre Mininode Privacy</p>
    <form id="contactForm" class="card form" autocomplete="on">
      <label>
        <span>Nombre</span>
        <input name="name" type="text" required placeholder="Tu nombre">
      </label>
      <label>
        <span>Email</span>
        <input name="email" type="email" required placeholder="tucorreo@dominio.com">
      </label>
      <label>
        <span>Mensaje</span>
        <textarea name="message" rows="5" required placeholder="Cuéntanos brevemente qué necesitas"></textarea>
      </label>
      <input type="hidden" name="_subject" value="Nuevo mensaje desde mininode.io">
      <button class="btn btn--primary" type="submit" id="contactSubmit">Enviar</button>
      <p id="formStatus" class="muted" role="status" aria-live="polite"></p>
    </form>
    <p class="muted">Usaremos tus datos para responder tu consulta. Consulta nuestra <a href="/legal/privacy/">Política de privacidad</a>.</p>
  </section>
  <script>
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/xwprvwrk";
  const form = document.getElementById('contactForm');
  const statusEl = document.getElementById('formStatus');
  const submitButton = document.getElementById('contactSubmit');
  const params = new URLSearchParams(window.location.search);
  const privacyContactContexts = {
    correction: {
      label: 'Consulta sobre Mininode Privacy',
      message: 'Quiero recibir ayuda para corregir las prioridades detectadas en mi sitio.',
    },
    'internal-review': {
      label: 'Consulta sobre revisión interna',
      message: 'Me interesa conocer futuras opciones para revisar procesos internos relacionados con privacidad.',
    },
    'technical-support': {
      label: 'Consulta sobre apoyo técnico',
      message: 'Necesito evaluar apoyo técnico para implementar cambios en mi sitio.',
    },
  };
  const contactContext = params.get('source') === 'privacy'
    ? privacyContactContexts[params.get('intent')]
    : null;
  if (contactContext) {
    document.getElementById('contactContext').textContent = contactContext.label;
    document.getElementById('contactContext').hidden = false;
    form.elements.message.value = contactContext.message;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = "Enviando...";
    submitButton.disabled = true;
    try {
      const data = new FormData(form);
      const res = await fetch(FORMSPREE_ENDPOINT, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
      if (res.ok) {
        form.reset();
        statusEl.textContent = "¡Gracias! Responderemos pronto.";
      } else {
        statusEl.innerHTML = 'No se pudo enviar. Intenta nuevamente o escríbenos a <a href="mailto:contact@mininode.io">contact@mininode.io</a>.';
      }
    } catch (err) {
      statusEl.innerHTML = 'Error de red. Intenta otra vez o escríbenos a <a href="mailto:contact@mininode.io">contact@mininode.io</a>.';
    } finally {
      submitButton.disabled = false;
    }
  });
  </script>
</main>
<div data-include="../partials/footer.html"></div>
</body>
</html>
