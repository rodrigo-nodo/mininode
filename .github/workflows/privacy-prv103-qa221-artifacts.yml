name: Privacy PRV-103 fresh holdout precheck

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/privacy_prv103_qa221_blind_artifacts.py'
      - '.github/workflows/privacy-prv103-qa221-artifacts.yml'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend/src:.github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify frozen product logic
        run: |
          git diff --exit-code 244671de83e5463d1f65a4bd7e2d561bc2f38fd5 -- \
            backend/src/mininode_api/domain_packs/privacy \
            backend/src/mininode_api/web_inspector \
            backend/src/mininode_api/services/privacy_diagnostic.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate fresh pool only
        run: python .github/scripts/privacy_prv103_qa221_blind_artifacts.py --validate-only
