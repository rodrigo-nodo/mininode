name: Privacy PRV-103 QA221 artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/privacy_prv103_qa221_blind_artifacts.py'
      - '.github/workflows/privacy-prv103-qa221-artifacts.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: backend/src:.github/scripts
      PRIVACY_PRV103_SHADOW_ENABLED: 'false'
      PRIVACY_PRV103_SHADOW_SAMPLE_RATE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify frozen product logic
        run: |
          git diff --exit-code 244671de83e5463d1f65a4bd7e2d561bc2f38fd5 -- \
            backend/src/mininode_api/domain_packs/privacy \
            backend/src/mininode_api/web_inspector \
            backend/src/mininode_api/services/privacy_diagnostic.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate sealed QA221 artifacts
        run: python .github/scripts/privacy_prv103_qa221_blind_artifacts.py

      - name: Upload Artifact A - blind evidence
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa221-artifact-a-blind-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa221/artifact-a-blind/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact B - predictions
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa221-artifact-b-predictions-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa221/artifact-b-predictions/
          if-no-files-found: error
          retention-days: 14
