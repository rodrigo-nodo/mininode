name: Temporary QA8 final freshness fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-qa8-final-freshness.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace remaining historical candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/privacy_prv103_qa8_capture.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'https://calendly.com/': 'https://www.front.com/',
              'https://www.loom.com/': 'https://www.gainsight.com/',
              'https://www.figma.com/': 'https://www.churnzero.com/',
              'https://www.algolia.com/': 'https://www.drift.com/',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-qa8-final-freshness.yml
          git config user.name "Rodrigo Tech"
          git config user.email "rodrigo.node@gmail.com"
          git add -A
          git commit -m "test(privacy): freeze final QA8 candidate pool"
          git push origin HEAD:${{ github.head_ref }}
