name: Apply PRV-103 v0.9 patch

on:
  push:
    branches:
      - fix/privacy-prv103-v09
    paths:
      - '.github/scripts/apply_prv103_v09.py'
      - '.github/workflows/apply-prv103-v09.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: backend/src
      PRIVACY_PRV103_SHADOW_ENABLED: 'false'
      PRIVACY_PRV103_SHADOW_SAMPLE_RATE: '0'
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: fix/privacy-prv103-v09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Apply focused PRV-103 patch
        run: python .github/scripts/apply_prv103_v09.py

      - name: Run focused tests
        run: |
          pytest -q \
            backend/tests/domain_packs/privacy/test_prv103_qa223_regression.py \
            backend/tests/domain_packs/privacy/test_evidence_adapter.py \
            backend/tests/web_inspector/test_form_context_capture.py \
            backend/tests/domain_packs/privacy/test_versioning.py \
            backend/tests/domain_packs/privacy/test_privacy_diagnostic.py::test_full_contract_runs_complete_privacy_pipeline

      - name: Check diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/src/mininode_api/domain_packs/privacy/evidence_adapter.py \
            backend/src/mininode_api/domain_packs/privacy/controls.json \
            backend/src/mininode_api/web_inspector/extractor.py \
            backend/tests/domain_packs/privacy/test_prv103_qa223_regression.py \
            backend/tests/domain_packs/privacy/test_versioning.py \
            backend/tests/domain_packs/privacy/test_privacy_diagnostic.py \
            backend/tests/web_inspector/test_form_context_capture.py \
            docs/privacy.md
          git commit -m 'fix(privacy): recalibrate PRV-103 deterministic purposes'
          git push origin HEAD:fix/privacy-prv103-v09
