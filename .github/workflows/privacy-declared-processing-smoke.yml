name: Privacy declared processing smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/mininode_api/domain_packs/privacy/declared_processing.py"
      - ".github/workflows/privacy-declared-processing-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenAI SDK
        run: python -m pip install "openai>=1.45.0"
      - name: Real API schema smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is unavailable"; exit 2; }
          PYTHONPATH=backend/src python - <<'PY'
          from mininode_api.domain_packs.privacy.declared_processing import PublicDocument, extract_declared_processing

          document = PublicDocument(
              url="https://example.test/privacy",
              text="Usamos cookies necesarias para que el sitio funcione.",
              document_type="privacy_policy",
              page_title="Privacidad",
          )
          result = extract_declared_processing(document)
          assert result["schema_version"] == "declared_processing/v1"
          print("SMOKE_PASS", result["schema_version"], len(result["records"]))
          PY
