name: Privacy PRV-103 final QA diagnostic

on:
  pull_request:
    paths:
      - '.github/scripts/privacy_prv103_final_qa_diagnostic.py'
      - '.github/workflows/privacy-prv103-final-qa-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend/src:.github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify frozen product logic
        run: |
          git diff --exit-code 723a20160d9b2bf39e5c7ef6ad3bf4878f45dd23 -- \
            backend/src/mininode_api/domain_packs/privacy \
            backend/src/mininode_api/web_inspector \
            backend/src/mininode_api/services/privacy_diagnostic.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Recapture final QA failures
        run: python .github/scripts/privacy_prv103_final_qa_diagnostic.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-final-qa-diagnostic-${{ github.run_id }}
          path: artifacts/privacy-prv103-final-qa-diagnostic/
          if-no-files-found: error
          retention-days: 14
