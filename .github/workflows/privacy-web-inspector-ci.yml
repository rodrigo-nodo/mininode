name: Privacy Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/privacy-web-inspector-ci.yml'
      - 'backend/src/mininode_api/web_inspector/extractor.py'
      - 'backend/src/mininode_api/web_inspector/selector.py'
      - 'backend/src/mininode_api/domain_packs/privacy/**'
      - 'backend/tests/web_inspector/test_extractor.py'
      - 'backend/tests/web_inspector/test_selector.py'
      - 'backend/tests/web_inspector/test_form_context_capture.py'
      - 'backend/tests/domain_packs/privacy/**'
      - 'frontend/privacy/framework-v0.6.js'
      - 'frontend/privacy/test_privacy_framework_sync.py'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Privacy Web regressions
        run: |
          pytest -q \
            backend/tests/web_inspector/test_extractor.py \
            backend/tests/web_inspector/test_selector.py \
            backend/tests/web_inspector/test_form_context_capture.py \
            backend/tests/domain_packs/privacy/ \
            --ignore=backend/tests/domain_packs/privacy/prv103_semantic_benchmark \
            --ignore=backend/tests/domain_packs/privacy/test_prv103_qa7_capture.py \
            --ignore=backend/tests/domain_packs/privacy/test_prv103_qa8_capture.py \
            frontend/privacy/test_privacy_framework_sync.py
