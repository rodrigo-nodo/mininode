name: Temporary privacy semantic NLI experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-nli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install benchmark and experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.55.4

      - name: Run unit tests before inference
        run: pytest -q backend/tests/domain_packs/privacy/semantic_benchmark

      - name: Download selected model and record revision
        run: |
          python - <<'PY'
          from huggingface_hub import model_info, snapshot_download

          model_id = "MoritzLaurer/mDeBERTa-v3-base-mnli-xnli"
          revision = model_info(model_id).sha
          snapshot_download(model_id, revision=revision)
          with open("model-revision.txt", "w", encoding="utf-8") as output:
              output.write(f"{model_id}@{revision}\n")
          print(f"Resolved model revision: {revision}")
          PY

      - name: Run frozen baseline
        run: |
          python -m backend.tests.domain_packs.privacy.semantic_benchmark.runner \
            --format json > baseline.json

      - name: Run direct NLI twice
        run: |
          python -m backend.tests.domain_packs.privacy.semantic_benchmark.semantic_nli_runner \
            --format json > nli-run-1.json
          python -m backend.tests.domain_packs.privacy.semantic_benchmark.semantic_nli_runner \
            --format json > nli-run-2.json

      - name: Compare run stability
        run: |
          python - <<'PY'
          import json
          import math

          with open("nli-run-1.json", encoding="utf-8") as source:
              first = json.load(source)
          with open("nli-run-2.json", encoding="utf-8") as source:
              second = json.load(source)

          first_rows = {
              (row["policy_id"], row["control"]): row for row in first["results"]
          }
          second_rows = {
              (row["policy_id"], row["control"]): row for row in second["results"]
          }
          differences = []
          score_tolerance = 1e-7
          for case_id in sorted(first_rows.keys() | second_rows.keys()):
              left = first_rows.get(case_id)
              right = second_rows.get(case_id)
              changed = []
              if left is None or right is None:
                  changed.append("missing_case")
              else:
                  for field in ("predicted_class", "evidence_fixture_id"):
                      if left[field] != right[field]:
                          changed.append(field)
                  score_keys = left["score"].keys() | right["score"].keys()
                  for key in score_keys:
                      if key not in left["score"] or key not in right["score"]:
                          changed.append(f"score.{key}")
                      elif not math.isclose(
                          left["score"][key], right["score"][key],
                          rel_tol=score_tolerance, abs_tol=score_tolerance,
                      ):
                          changed.append(f"score.{key}")
              if changed:
                  differences.append({
                      "policy_id": case_id[0],
                      "control": case_id[1],
                      "changed_fields": changed,
                      "run_1_class": left and left["predicted_class"],
                      "run_2_class": right and right["predicted_class"],
                  })

          report = {
              "stable_predictions": not differences,
              "prediction_differences": len(differences),
              "score_tolerance": score_tolerance,
              "differences": differences,
          }
          with open("stability-report.json", "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2, ensure_ascii=False)
              output.write("\n")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Record dependency versions
        run: python -m pip freeze > experiment-dependencies.txt

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: privacy-semantic-nli-w2s2b
          if-no-files-found: error
          retention-days: 30
          path: |
            baseline.json
            nli-run-1.json
            nli-run-2.json
            stability-report.json
            model-revision.txt
            experiment-dependencies.txt
