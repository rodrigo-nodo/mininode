name: Privacy PRV-103 QA7

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/privacy_prv103_qa7_capture.py'
      - '.github/workflows/privacy-prv103-qa7.yml'
      - 'backend/tests/domain_packs/privacy/test_prv103_qa7_capture.py'
      - 'docs/privacy-prv103-qa7.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: backend/src:.github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Test QA7 contract
        run: pytest -q backend/tests/domain_packs/privacy/test_prv103_qa7_capture.py

      - name: Capture QA7 blind reconstruction
        run: python .github/scripts/privacy_prv103_qa7_capture.py

      - name: Upload QA7 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa7-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa7/
          if-no-files-found: error
          retention-days: 14
