name: Privacy declared processing QA
on:
  workflow_run:
    workflows: ["Privacy Web CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  qa:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'privacy/declared-processing-qa1-run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Run frozen QA inference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is unavailable"; exit 2; }
          PYTHONPATH=backend/src python backend/tests/domain_packs/privacy/declared_processing_qa1/run.py
      - name: Commit QA outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/domain_packs/privacy/declared_processing_qa1/outputs backend/tests/domain_packs/privacy/declared_processing_qa1/run_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "test(privacy): record QA inference outputs"
          git fetch origin privacy/declared-processing-qa1-run
          git rebase origin/privacy/declared-processing-qa1-run
          git push origin HEAD:privacy/declared-processing-qa1-run
