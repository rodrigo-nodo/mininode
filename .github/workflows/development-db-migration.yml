name: Development DB Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Exact SQL filename from backend/migrations'
        required: true
        type: string
      confirmation:
        description: 'Type RUN_DEVELOPMENT_MIGRATION to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN_DEVELOPMENT_MIGRATION" || {
            echo "Development migration confirmation does not match."
            exit 1
          }

      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL driver
        run: pip install 'psycopg[binary]>=3.2,<4'

      - name: Run approved migration
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "DEVELOPMENT_DATABASE_URL secret is not configured."
            exit 1
          }
          python scripts/run_migration.py "migrations/$MIGRATION"
