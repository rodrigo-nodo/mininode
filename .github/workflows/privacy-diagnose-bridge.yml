name: Privacy Diagnose Bridge

on:
  workflow_dispatch:
    inputs:
      label:
        description: Batch label used in artifact filenames
        required: false
        default: manual
        type: string
      urls:
        description: Public website URLs, one per line
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/privacy-run' &&
        github.event.issue.user.login == 'rodrigo-nodo'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Mininode API secret
        shell: bash
        env:
          MININODE_API_KEY: ${{ secrets.MININODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MININODE_API_KEY:-}" ]; then
            echo "::error::MININODE_API_KEY is not available to this workflow"
            exit 1
          fi

      - name: Resolve batch input
        id: batch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URLS: ${{ inputs.urls }}
          DISPATCH_LABEL: ${{ inputs.label }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URLS="$DISPATCH_URLS"
            LABEL="${DISPATCH_LABEL:-manual}"
          else
            URLS="$(printf '%s\n' "$ISSUE_BODY" | grep -Eo 'https?://[^[:space:]<>`)]+/?' || true)"
            LABEL="issue-${ISSUE_NUMBER}"
          fi

          if [ -z "${URLS//[$'\t\r\n ']/}" ]; then
            echo "::error::No URLs found for Privacy batch"
            exit 1
          fi

          {
            echo 'urls<<EOF'
            printf '%s\n' "$URLS"
            echo EOF
            echo "label=$LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Run Privacy batch
        env:
          MININODE_API_KEY: ${{ secrets.MININODE_API_KEY }}
          PRIVACY_URLS: ${{ steps.batch.outputs.urls }}
          PRIVACY_BATCH_LABEL: ${{ steps.batch.outputs.label }}
          PRIVACY_ENDPOINT: https://mininode.io/api/privacy/diagnose
          PRIVACY_OUTPUT_DIR: automation/privacy/results
        run: python automation/privacy/run_diagnose_batch.py

      - name: Upload Privacy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-diagnose-${{ steps.batch.outputs.label }}-${{ github.run_id }}
          path: automation/privacy/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Post compact result to source issue
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.batch.outputs.label }}
        run: |
          set -euo pipefail
          CSV="automation/privacy/results/privacy-diagnose-${LABEL}.csv"
          COMMENT="$(mktemp)"
          {
            echo "Privacy batch completed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f "$CSV" ]; then
              echo '```csv'
              cat "$CSV"
              echo '```'
            else
              echo "No CSV summary was produced."
            fi
          } > "$COMMENT"
          gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT"
