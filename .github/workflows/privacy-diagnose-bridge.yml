name: Privacy Diagnose Bridge

on:
  push:
    branches:
      - automation/privacy-github-test
    paths:
      - 'automation/privacy/requests/*.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/privacy-github-test

      - name: Run Privacy diagnosis
        shell: bash
        env:
          MININODE_API_KEY: ${{ secrets.MININODE_API_KEY }}
        run: |
          set -u -o pipefail
          mkdir -p automation/privacy/results
          for request in automation/privacy/requests/*.json; do
            [ -e "$request" ] || continue
            python - "$request" <<'PY' > /tmp/privacy-sites.tsv
          import json, sys, re
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          rubro=data.get('rubro','')
          if 'sites' in data:
              for s in data['sites']:
                  slug=s.get('slug') or re.sub(r'[^a-z0-9]+','-',s.get('name','site').lower()).strip('-')
                  fields=[slug,s.get('url',''),s.get('name',''),rubro,s.get('description',''),s.get('size_estimate','')]
                  print('\t'.join(str(x).replace('\t',' ').replace('\n',' ') for x in fields))
          elif 'url' in data:
              name=sys.argv[1].rsplit('/',1)[-1].rsplit('.',1)[0]
              fields=[name,data.get('url',''),data.get('name',name),rubro,data.get('description',''),data.get('size_estimate','')]
              print('\t'.join(str(x).replace('\t',' ').replace('\n',' ') for x in fields))
          PY
            while IFS=$'\t' read -r slug url company rubro description size_estimate; do
              [ -n "$url" ] || continue
              echo "Diagnosing $company ($url)"
              tmp="$(mktemp)"
              http_code="$(curl --silent --show-error \
                -X POST 'https://api.mininode.io/privacy/diagnose' \
                -H 'Content-Type: application/json' \
                -H "X-Api-Key: ${MININODE_API_KEY}" \
                --data "$(python -c 'import json,sys; print(json.dumps({"url":sys.argv[1]}))' "$url")" \
                -o "$tmp" -w '%{http_code}')" || http_code="000"
              python - "$slug" "$url" "$company" "$rubro" "$description" "$size_estimate" "$http_code" "$tmp" <<'PY'
          import json, sys
          slug,url,company,rubro,description,size_estimate,status,tmp=sys.argv[1:]
          metadata={
              'company': company,
              'rubro': rubro,
              'description': description,
              'size_estimate': size_estimate,
              'url': url,
          }
          try:
              raw=open(tmp,encoding='utf-8',errors='replace').read()
          except Exception:
              raw=''
          if status.startswith('2'):
              try:
                  diagnosis=json.loads(raw)
              except Exception:
                  diagnosis={'raw_response':raw}
              out={'metadata':metadata,'diagnosis':diagnosis}
          else:
              out={'metadata':metadata,'error':True,'http_status':status,'response':raw}
          with open(f'automation/privacy/results/{slug}.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
              rm -f "$tmp"
              if [[ ! "$http_code" =~ ^2 ]]; then
                echo "ERROR $http_code for $url; continuing batch"
              fi
            done < /tmp/privacy-sites.tsv
          done

      - name: Commit results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/privacy/results
          if git diff --cached --quiet; then
            echo 'No new results to commit.'
            exit 0
          fi
          git commit -m 'test: store privacy diagnosis batch results'
          git push origin HEAD:automation/privacy-github-test
