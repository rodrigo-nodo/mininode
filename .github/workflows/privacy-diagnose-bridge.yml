name: Privacy Diagnose Bridge

on:
  push:
    branches:
      - automation/privacy-github-test
    paths:
      - 'automation/privacy/requests/*.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/privacy-github-test

      - name: Run Privacy diagnosis
        shell: bash
        env:
          MININODE_API_KEY: ${{ secrets.MININODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p automation/privacy/results
          for request in automation/privacy/requests/*.json; do
            [ -e "$request" ] || continue
            python - "$request" <<'PY' > /tmp/privacy-sites.tsv
          import json, sys, re
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if 'sites' in data:
              for s in data['sites']:
                  slug=s.get('slug') or re.sub(r'[^a-z0-9]+','-',s.get('name','site').lower()).strip('-')
                  print(f"{slug}\t{s['url']}")
          elif 'url' in data:
              name=sys.argv[1].rsplit('/',1)[-1].rsplit('.',1)[0]
              print(f"{name}\t{data['url']}")
          PY
            while IFS=$'\t' read -r name url; do
              [ -n "$url" ] || continue
              echo "Diagnosing $url"
              curl --fail-with-body --silent --show-error \
                -X POST 'https://api.mininode.io/privacy/diagnose' \
                -H 'Content-Type: application/json' \
                -H "X-Api-Key: ${MININODE_API_KEY}" \
                --data "$(python -c 'import json,sys; print(json.dumps({"url":sys.argv[1]}))' "$url")" \
                -o "automation/privacy/results/${name}.json"
            done < /tmp/privacy-sites.tsv
          done

      - name: Commit results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/privacy/results
          if git diff --cached --quiet; then
            echo 'No new results to commit.'
            exit 0
          fi
          git commit -m 'test: store privacy diagnosis result'
          git push origin HEAD:automation/privacy-github-test
