name: PRV-102 temporary calibration

on:
  push:
    branches:
      - codex/calibrar-prv-102-en-sitios-reales
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run sanitized PRV-102 calibration
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          from mininode_api.domain_packs.privacy.evidence_adapter import _personal_form
          from mininode_api.services.privacy_diagnostic import (
              PrivacyInspectionError,
              diagnose_privacy_url,
          )
          from mininode_api.web_inspector import (
              WebFetcher,
              classify_page_candidates,
              discover_include_links,
              extract_page,
          )

          CASES = [
              ("C01", "E-commerce", "https://www.beardbrand.com/"),
              ("C02", "Servicios profesionales", "https://www.beneschlaw.com/"),
              ("C03", "Educación", "https://www.harvard.edu/"),
              ("C04", "Salud", "https://www.nhs.uk/"),
              ("C05", "SaaS/tecnología", "https://about.gitlab.com/"),
              ("C06", "Microempresa/sitio simple", "https://wickedgrounds.com/"),
          ]

          def clean_url(value):
              if not value:
                  return None
              try:
                  parsed = urlsplit(value)
              except ValueError:
                  return None
              if parsed.scheme not in {"http", "https"} or not parsed.hostname:
                  return None
              host = parsed.hostname.lower().rstrip(".")
              if parsed.port:
                  host = f"{host}:{parsed.port}"
              return urlunsplit((parsed.scheme.lower(), host, parsed.path or "/", "", ""))

          def control(diagnostic, code):
              if not diagnostic:
                  return None
              for item in diagnostic.get("controls", []):
                  if item.get("control_code") == code:
                      return item
              return None

          def sanitized_control(item):
              if not item:
                  return None
              out = {
                  "result": item.get("result"),
                  "confidence": item.get("confidence"),
              }
              source = item.get("source_url")
              if source:
                  out["source_url"] = clean_url(source)
              evidence = item.get("evidence")
              if isinstance(evidence, list):
                  urls = []
                  for entry in evidence:
                      if isinstance(entry, dict):
                          for key in ("url", "source_url"):
                              if entry.get(key):
                                  cleaned = clean_url(entry[key])
                                  if cleaned and cleaned not in urls:
                                      urls.append(cleaned)
                  if urls:
                      out["source_urls"] = urls
              return out

          def manual_extract(url):
              started = time.monotonic()
              deadline = started + 30.0
              forms = []
              pages = []
              errors = []
              with WebFetcher(inspection_budget=30.0) as fetcher:
                  home = fetcher.fetch(url, [url], deadline=deadline)
                  if not home.pages or home.pages_fetched != 1:
                      return {"pages": [], "forms": [], "errors": [
                          {
                              "phase": "home_fetch",
                              "code": home.pages[0].error.code if home.pages and home.pages[0].error else "inspection_failed",
                          }
                      ]}
                  hp = home.pages[0]
                  if hp.error or hp.html is None or hp.final_url is None:
                      return {"pages": [], "forms": [], "errors": [
                          {
                              "phase": hp.failure_phase or "home_fetch",
                              "code": hp.error.code if hp.error else "inspection_failed",
                          }
                      ]}

                  extracted_home = extract_page(hp.html, hp.final_url)
                  candidates = classify_page_candidates(hp.final_url, extracted_home.links)
                  selected = []
                  for category in ("contact", "action"):
                      for candidate in candidates:
                          if candidate.category == category and candidate.url not in selected:
                              selected.append(candidate.url)
                              break

                  fetches = [(hp.final_url, hp.html)]
                  if selected:
                      extra = fetcher.fetch(hp.final_url, selected[:4], deadline=deadline)
                      for page in extra.pages:
                          if page.error:
                              errors.append({
                                  "phase": page.failure_phase or "candidate_fetch",
                                  "code": page.error.code,
                                  "requested_url": clean_url(page.requested_url),
                              })
                          elif page.html is not None and page.final_url is not None:
                              fetches.append((page.final_url, page.html))

                  for page_url, html in fetches:
                      pages.append(clean_url(page_url))
                      extracted = extract_page(html, page_url)
                      for form in extracted.forms:
                          is_personal, confidence = _personal_form(form)
                          parsed_source = urlsplit(form.source_url)
                          parsed_action = urlsplit(form.action)
                          fields = []
                          for field in form.fields[:12]:
                              fields.append({
                                  "type": (field.type or "")[:40],
                                  "name": (field.name or "")[:80],
                                  "label": (field.label or "")[:120],
                                  "required": bool(field.required),
                              })
                          forms.append({
                              "source_url": clean_url(form.source_url),
                              "source_hostname": (parsed_source.hostname or "").lower() or None,
                              "source_scheme": parsed_source.scheme.lower() or None,
                              "action_hostname": (parsed_action.hostname or "").lower() or None,
                              "action_scheme": parsed_action.scheme.lower() or None,
                              "method": (form.method or "").lower(),
                              "product_personal": bool(is_personal),
                              "product_personal_confidence": confidence,
                              "fields": fields,
                          })
              return {
                  "pages": [p for p in pages if p],
                  "forms": forms,
                  "errors": errors,
              }

          output = {
              "baseline": {
                  "main_sha": "457dee7da163f9541bc2e55e01f94f69f860e26a",
                  "framework_version_expected": "0.2",
                  "scoring_version_expected": "0.1",
              },
              "cases": [],
          }

          for case_id, sector, url in CASES:
              item = {
                  "case_id": case_id,
                  "sector": sector,
                  "requested_url": clean_url(url),
              }
              try:
                  diagnostic = diagnose_privacy_url(url)
              except PrivacyInspectionError as exc:
                  item["product_error"] = {
                      "code": exc.code,
                      "diagnostic": {
                          key: value
                          for key, value in (exc.diagnostic or {}).items()
                          if key in {
                              "failure_phase",
                              "internal_error_code",
                              "status_code",
                              "transport_error_class",
                              "dns_failure_category",
                          }
                      },
                  }
                  diagnostic = None
              except Exception as exc:
                  item["product_error"] = {
                      "code": "unexpected_error",
                      "class": type(exc).__name__,
                  }
                  diagnostic = None

              if diagnostic:
                  item["product"] = {
                      "site_url": clean_url(diagnostic.get("site_url")),
                      "scope": diagnostic.get("scope"),
                      "framework_version": diagnostic.get("framework_version"),
                      "scoring_version": diagnostic.get("scoring_version"),
                      "PRV-101": sanitized_control(control(diagnostic, "PRV-101")),
                      "PRV-102": sanitized_control(control(diagnostic, "PRV-102")),
                  }

              try:
                  item["manual_evidence"] = manual_extract(url)
              except Exception as exc:
                  item["manual_error"] = {
                      "code": "unexpected_error",
                      "class": type(exc).__name__,
                  }

              output["cases"].append(item)

          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/privacy-prv102-calibration.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary = []
          for item in output["cases"]:
              product = item.get("product") or {}
              prv102 = product.get("PRV-102") or {}
              summary.append({
                  "case_id": item["case_id"],
                  "product_error": (item.get("product_error") or {}).get("code"),
                  "prv102": prv102.get("result"),
                  "forms_seen": len((item.get("manual_evidence") or {}).get("forms", [])),
              })
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload sanitized calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv102-calibration
          path: artifacts/privacy-prv102-calibration.json
          if-no-files-found: error
          retention-days: 7
