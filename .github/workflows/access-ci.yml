name: Access CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/access-ci.yml'
      - 'backend/src/mininode_api/main.py'
      - 'backend/src/mininode_api/services/access.py'
      - 'backend/src/mininode_api/services/access_identity.py'
      - 'backend/src/mininode_api/services/clerk_identity.py'
      - 'backend/src/mininode_api/core/access_auth.py'
      - 'backend/src/mininode_api/api/access.py'
      - 'backend/requirements.txt'
      - 'backend/tests/test_access_persistence.py'
      - 'backend/tests/test_access_identity_api.py'
      - 'backend/tests/test_access_clerk_identity.py'
      - 'backend/tests/test_access_clerk_jwks.py'
      - 'backend/tests/test_access_clerk_malformed_token.py'
      - 'backend/tests/test_access_provider_fallback.py'
      - 'backend/tests/test_access_authorization_api.py'
      - 'frontend/functions/api/**'
      - 'frontend/index.html'
      - 'frontend/access/**'
      - 'docs/access.md'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mininode_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mininode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend/src
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mininode_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Access tests
        run: pytest -q backend/tests/test_access_persistence.py backend/tests/test_access_identity_api.py backend/tests/test_access_clerk_identity.py backend/tests/test_access_clerk_jwks.py backend/tests/test_access_clerk_malformed_token.py backend/tests/test_access_provider_fallback.py backend/tests/test_access_authorization_api.py

      - name: Run Access proxy tests
        run: node --test frontend/functions/api/test_proxy.mjs

      - name: Run Access client UI tests
        run: node --test frontend/access/test_access.mjs

      - name: Compile backend
        run: python -m compileall -q backend/src/mininode_api
