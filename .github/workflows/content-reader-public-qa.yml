name: Content Reader Public QA

on:
  push:
    branches:
      - qa/content-reader-smiley
    paths:
      - '.github/workflows/content-reader-public-qa.yml'
      - 'automation/content_reader/qa_public_document.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Capture once and compare entire static document
        run: python automation/content_reader/qa_public_document.py
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-reader-smiley-qa
          path: content-reader-qa-output/
          retention-days: 7
          if-no-files-found: warn
