name: Temporary QA8 candidate fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-qa8-candidate-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace historical candidates before QA8 capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/privacy_prv103_qa8_capture.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'https://clickup.com/': 'https://calendly.com/',
              'https://monday.com/': 'https://doodle.com/',
              'https://www.intercom.com/': 'https://lucid.co/',
              'https://www.zendesk.com/': 'https://www.loom.com/',
              'https://www.klaviyo.com/': 'https://www.figma.com/',
              'https://www.braze.com/': 'https://maze.co/',
              'https://www.shopify.com/': 'https://www.usertesting.com/',
              'https://www.bigcommerce.com/': 'https://sprig.com/',
              'https://stripe.com/': 'https://launchdarkly.com/',
              'https://www.digitalocean.com/': 'https://www.statsig.com/',
              'https://www.mongodb.com/': 'https://www.algolia.com/',
              'https://www.confluent.io/': 'https://www.workato.com/',
              'https://www.elastic.co/': 'https://tray.ai/',
              'https://sentry.io/': 'https://www.make.com/',
              'https://newrelic.com/': 'https://n8n.io/',
              'https://mixpanel.com/': 'https://temporal.io/',
              'https://amplitude.com/': 'https://www.sonarsource.com/',
              'https://heap.io/': 'https://www.cyberark.com/',
              'https://webflow.com/': 'https://www.tenable.com/',
              'https://www.wix.com/': 'https://www.rapid7.com/',
              'https://www.contentful.com/': 'https://www.qualys.com/',
              'https://www.okta.com/': 'https://www.oneidentity.com/',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test = Path('backend/tests/domain_packs/privacy/test_prv103_qa8_capture.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace('    assert "hostname" not in text\n', '    assert "example.test" not in text\n')
          test.write_text(t, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-qa8-candidate-fix.yml
          git config user.name "Rodrigo Tech"
          git config user.email "rodrigo.node@gmail.com"
          git add -A
          git commit -m "test(privacy): finalize QA8 fresh candidate pool"
          git push origin HEAD:${{ github.head_ref }}
