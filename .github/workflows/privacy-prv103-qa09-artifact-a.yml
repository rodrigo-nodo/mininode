name: Privacy PRV-103 QA09 Artifact A

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/privacy_prv103_qa09_artifact_a.py
      - .github/workflows/privacy-prv103-qa09-artifact-a.yml
      - backend/tests/domain_packs/privacy/test_prv103_qa09_artifact_a.py
      - automation/privacy/test_precheck_prv103_holdout.py
      - docs/evidence/prv103-holdout-0.9-candidates.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-artifact-a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: backend/src:.github/scripts
    steps:
      - name: Checkout frozen holdout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify frozen product and pool
        run: |
          git merge-base --is-ancestor 6fbe6f94887114f4a5459af861f1fcaa0c4b7bd7 HEAD
          git diff --exit-code 6fbe6f94887114f4a5459af861f1fcaa0c4b7bd7 -- \
            backend/src/mininode_api/domain_packs/privacy \
            backend/src/mininode_api/web_inspector \
            backend/src/mininode_api/services/privacy_diagnostic.py
          test "$(wc -l < docs/evidence/prv103-holdout-0.9-candidates.txt)" -eq 99
          echo "33383fc229068633915d215404f0c9e0d368a1c7d2d968ad7047b97c1136b14a  docs/evidence/prv103-holdout-0.9-candidates.txt" | sha256sum --check --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Test frozen Artifact A contract
        run: pytest -q backend/tests/domain_packs/privacy/test_prv103_qa09_artifact_a.py automation/privacy/test_precheck_prv103_holdout.py

      - name: Capture blind Artifact A
        run: python .github/scripts/privacy_prv103_qa09_artifact_a.py

      - name: Upload blind Artifact A for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa09-artifact-a-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa09/artifact-a.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sealed internal manifest separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa09-internal-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa09/internal-manifest.json
          if-no-files-found: error
          retention-days: 14
