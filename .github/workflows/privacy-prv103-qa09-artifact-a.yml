name: Privacy PRV-103 QA09 Artifact A

# QA09 final: Artifact A is frozen; this workflow now runs only the frozen comparison.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/privacy_prv103_qa09_artifact_a.py
      - .github/workflows/privacy-prv103-qa09-artifact-a.yml
      - backend/tests/domain_packs/privacy/test_prv103_qa09_artifact_a.py
      - automation/privacy/test_precheck_prv103_holdout.py
      - automation/privacy/run_prv103_qa09_final_v2.py
      - docs/evidence/prv103-holdout-0.9-candidates.txt
      - docs/evidence/prv103-holdout-0.9-artifact-a.json
      - docs/evidence/prv103-holdout-0.9-gold.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-artifact-a:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Artifact A is frozen; recapture disabled.'

  final-qa:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout frozen QA branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify frozen product is unchanged
        run: |
          git merge-base --is-ancestor 6fbe6f94887114f4a5459af861f1fcaa0c4b7bd7 HEAD
          git diff --exit-code 6fbe6f94887114f4a5459af861f1fcaa0c4b7bd7 -- backend/src/mininode_api/domain_packs/privacy backend/src/mininode_api/web_inspector backend/src/mininode_api/services/privacy_diagnostic.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run frozen final comparison
        run: python automation/privacy/run_prv103_qa09_final_v2.py
      - name: Upload final QA result
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa09-final-${{ github.run_id }}
          path: artifacts/privacy-prv103-qa09-final/result.json
          if-no-files-found: error
          retention-days: 14
