name: Privacy PRV-103 Intent LLM V2 Tests

on:
  push:
    branches:
      - research/prv103-intent-llm-v2
    paths:
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/intent_llm_*'
      - '.github/workflows/privacy-prv103-intent-llm-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: pip install pytest

      - name: Run protocol tests
        run: pytest -q backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_intent_llm_runner.py
