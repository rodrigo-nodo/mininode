name: Temporary PRV-103 contact fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-prv103-contact-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply focused PRV-103 correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          adapter = 'backend/src/mininode_api/domain_packs/privacy/evidence_adapter.py'
          replace(adapter,
              '    "subscribirme", "suscribirse", "contactanos", "contactenos", "contactar", "hablemos",\n',
              '    "subscribirme", "suscribirse", "contactanos", "contactenos", "contactar", "hablemos",\n    "escribenos",\n')
          replace(adapter,
              '    "send message", "send a message", "tell us a bit more", "enviar formulario",\n    "enviar el formulario",\n',
              '    "send message", "send a message", "send us a message", "tell us a bit more",\n    "enviar mensaje", "enviar un mensaje", "envia un mensaje", "enviar formulario",\n    "enviar el formulario",\n')
          replace(adapter,
              '    r"\\b(?:enviar|envia|envianos)\\b.{0,30}\\b(?:consulta|mensaje)\\b",\n',
              '    r"\\b(?:enviar|envia|envianos)\\b.{0,30}\\bconsulta\\b",\n')
          replace(adapter,
              '    r"\\bsend\\b.{0,20}\\b(?:an inquiry|us a message)\\b",\n',
              '    r"\\bsend\\b.{0,20}\\ban inquiry\\b",\n')
          replace(adapter, '    r"\\b(?:escribenos)\\b",\n', '')

          test_adapter = 'backend/tests/domain_packs/privacy/test_evidence_adapter.py'
          replace(test_adapter,
              '    ({"submit_text": "Escríbenos"}, "concrete", "detected"),\n',
              '    ({"submit_text": "Escríbenos"}, "generic", "partial"),\n    ({"submit_text": "Enviar mensaje"}, "generic", "partial"),\n    ({"submit_text": "Send us a message"}, "generic", "partial"),\n')
          marker = 'def test_prv103_does_not_infer_from_nearby_fields_or_privacy_evidence():\n'
          regression = '''def test_prv103_qa7_019_general_help_contact_is_generic():
    adapted = adapt_evidence(contract(forms=[form(
        field_type="email",
        heading="¿Tienes dudas o necesitas ayuda?",
        submit_text="Escríbenos",
    )]))
    assert adapted["PRV-103"]["form_purpose"] == "generic"
    prv101 = evaluate_control("PRV-101", adapted["PRV-101"])
    assert evaluate_control(
        "PRV-103", adapted["PRV-103"], {"PRV-101": prv101}
    )["result"] == "partial"


'''
          replace(test_adapter, marker, regression + marker)

          controls = Path('backend/src/mininode_api/domain_packs/privacy/controls.json')
          data = json.loads(controls.read_text(encoding='utf-8'))
          if data.get('version') != '0.6':
              raise SystemExit(f'Unexpected controls version: {data.get("version")}')
          data['version'] = '0.7'
          controls.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          framework06 = Path('frontend/privacy/data/privacy-framework-v0.6.json')
          framework07 = Path('frontend/privacy/data/privacy-framework-v0.7.json')
          framework = json.loads(framework06.read_text(encoding='utf-8'))
          if framework['framework'].get('version') != '0.6':
              raise SystemExit('Unexpected documented framework version')
          framework['framework']['version'] = '0.7'
          framework07.write_text(json.dumps(framework, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pack_test = 'backend/tests/domain_packs/privacy/test_privacy_pack.py'
          replace(pack_test, '/ "privacy-framework-v0.6.json"\n', '/ "privacy-framework-v0.7.json"\n', count=2)
          replace(pack_test,
              'def test_documental_framework_keeps_history_and_publishes_v06():\n',
              'def test_documental_framework_keeps_history_and_publishes_v07():\n')
          replace(pack_test,
              '    v05_path = framework_directory / "privacy-framework-v0.5.json"\n    current_path = framework_directory / "privacy-framework-v0.7.json"\n',
              '    v05_path = framework_directory / "privacy-framework-v0.5.json"\n    v06_path = framework_directory / "privacy-framework-v0.6.json"\n    current_path = framework_directory / "privacy-framework-v0.7.json"\n')
          replace(pack_test,
              '    v05 = json.loads(v05_path.read_text(encoding="utf-8"))["framework"]\n    current = json.loads(current_path.read_text(encoding="utf-8"))["framework"]\n',
              '    v05 = json.loads(v05_path.read_text(encoding="utf-8"))["framework"]\n    v06 = json.loads(v06_path.read_text(encoding="utf-8"))["framework"]\n    current = json.loads(current_path.read_text(encoding="utf-8"))["framework"]\n')
          replace(pack_test,
              '    assert v05["version"] == "0.5"\n    assert current["version"] == "0.6"\n',
              '    assert v05["version"] == "0.5"\n    assert v06["version"] == "0.6"\n    assert current["version"] == "0.7"\n')

          version_test = 'backend/tests/domain_packs/privacy/test_versioning.py'
          replace(version_test, 'assert load_control_catalog()["version"] == "0.6"', 'assert load_control_catalog()["version"] == "0.7"')
          replace(version_test, '"framework_version": "0.6"', '"framework_version": "0.7"')
          replace(version_test,
              '(("0.5", "0.1"), ("0.6", "0.1"), "not_comparable", "framework_version_mismatch"),',
              '(("0.6", "0.1"), ("0.7", "0.1"), "not_comparable", "framework_version_mismatch"),')

          diagnostic_test = 'backend/tests/domain_packs/privacy/test_privacy_diagnostic.py'
          replace(diagnostic_test, 'assert result["framework_version"] == "0.6"', 'assert result["framework_version"] == "0.7"')

          frontend_sync = 'frontend/privacy/test_privacy_framework_sync.py'
          replace(frontend_sync, 'def test_runtime_matrix_matches_backend_framework_0_6(self):', 'def test_runtime_matrix_matches_backend_framework_0_7(self):')
          replace(frontend_sync, 'self.assertEqual(CONTROLS["version"], "0.6")', 'self.assertEqual(CONTROLS["version"], "0.7")')

          docs = 'docs/privacy.md'
          replace(docs,
              'La versión vigente del framework es `0.6`; el scoring permanece en `0.1`.\n',
              'La versión vigente del framework es `0.7`; el scoring permanece en `0.1`.\nEn PRV-103, el contacto general (`Escríbenos`, `Enviar mensaje` o equivalentes) se clasifica como finalidad genérica; solo se considera concreta cuando el mismo formulario expresa un resultado o servicio específico observable.\n')
          PY

      - name: Run focused tests
        shell: bash
        env:
          PYTHONPATH: backend/src
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r backend/requirements.txt pytest >/dev/null
          pytest -q \
            backend/tests/domain_packs/privacy/test_evidence_adapter.py \
            backend/tests/domain_packs/privacy/test_versioning.py \
            backend/tests/domain_packs/privacy/test_privacy_pack.py \
            backend/tests/domain_packs/privacy/test_privacy_diagnostic.py \
            -k 'not test_frontend_conditionally_renders_safe_source_path_and_home_label'
          python frontend/privacy/test_privacy_framework_sync.py

      - name: Commit focused change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-prv103-contact-fix.yml
          git config user.name "Rodrigo Tech"
          git config user.email "rodrigo.node@gmail.com"
          git add -A
          git commit -m "fix(privacy): classify generic contact as generic purpose"
          git push origin HEAD:${{ github.head_ref }}
