name: Privacy PRV-103 Routing V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/privacy-prv103-routing-v2.yml'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/intent_taxonomy_v2.json'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/semantic_contract_v2.json'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa7_cases.json'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/routing_v2_runner.py'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_routing_v2_runner.py'

permissions:
  contents: read

jobs:
  benchmark:
    if: github.head_ref == 'research/privacy-prv103-semantic-router-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: backend/src:backend/tests/domain_packs/privacy/prv103_semantic_benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify production PRV-103 source is unchanged
        run: |
          git diff --exit-code 36039985817eb996a41a33e3254c610a635c9143 -- \
            backend/src/mininode_api/domain_packs/privacy \
            backend/src/mininode_api/web_inspector \
            backend/src/mininode_api/services/privacy_diagnostic.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Test frozen semantic routing contract
        run: pytest -q backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_routing_v2_runner.py

      - name: Require OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Benchmark LLM-all and residual router over consumed QA6-QA8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python backend/tests/domain_packs/privacy/prv103_semantic_benchmark/routing_v2_runner.py \
            --output artifacts/privacy-prv103-routing-v2/result.json

      - name: Upload development benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-routing-v2-${{ github.run_id }}
          path: artifacts/privacy-prv103-routing-v2/
          if-no-files-found: error
          retention-days: 14
