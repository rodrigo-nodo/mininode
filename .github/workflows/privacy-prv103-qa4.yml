name: Temporary PRV-103 QA4

on:
  push:
    branches:
      - qa/privacy-prv103-qa4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        region: [chile, latam, intl]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run PRV-103 QA4 holdout
        env:
          PYTHONPATH: backend/src
        run: python .github/scripts/privacy_prv103_qa4.py --region "${{ matrix.region }}"

      - name: Upload internal QA4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa4-${{ matrix.region }}-internal
          path: artifacts/privacy-prv103-qa4-${{ matrix.region }}-internal.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload blind Reviewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prv103-qa4-${{ matrix.region }}-blind
          path: |
            artifacts/privacy-prv103-qa4-${{ matrix.region }}-blind.json
            artifacts/privacy-prv103-qa4-${{ matrix.region }}-reviewer.md
          if-no-files-found: error
          retention-days: 7
