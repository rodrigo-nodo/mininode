name: Privacy PRV-103 Intent QA6

on:
  push:
    branches:
      - qa/privacy-prv103-intent-qa6
    paths:
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa6_gold.json'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa6_intent_llm_runner.py'
      - 'backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_qa6_intent_llm_runner.py'
      - '.github/workflows/privacy-prv103-intent-qa6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: .:backend/tests/domain_packs/privacy/prv103_semantic_benchmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate OpenAI API secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Install test and experiment dependencies
        run: pip install pytest 'openai>=1.45.0'

      - name: Run frozen protocol tests
        run: |
          pytest -q \
            backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_intent_llm_runner.py \
            backend/tests/domain_packs/privacy/prv103_semantic_benchmark/test_qa6_intent_llm_runner.py

      - name: Run QA6 quality pass
        run: |
          python backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa6_intent_llm_runner.py run \
            --run 1 --output-dir artifacts/prv103-intent-qa6

      - name: Run QA6 stability pass
        run: |
          python backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa6_intent_llm_runner.py run \
            --run 2 --output-dir artifacts/prv103-intent-qa6

      - name: Build frozen QA6 summary
        run: |
          python backend/tests/domain_packs/privacy/prv103_semantic_benchmark/qa6_intent_llm_runner.py summary \
            --output-dir artifacts/prv103-intent-qa6

      - name: Upload QA6 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prv103-intent-qa6-results
          path: artifacts/prv103-intent-qa6
          retention-days: 7
