name: Production DB Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Exact SQL filename from backend/migrations'
        required: true
        type: string
      confirmation:
        description: 'Type RUN_PRODUCTION_MIGRATION to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN_PRODUCTION_MIGRATION" || {
            echo "Production migration confirmation does not match."
            exit 1
          }

      # Promotion migrations are exclusively applied by the checksummed
      # Render Pre-deploy runner, in two authorized batches.
      - name: Reject DEV to PROD promotion migrations
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          case "$MIGRATION" in
            20261019_access_site_aliases.sql|20261019_access_workspace_site_unlink.sql|20261020_access_site_group_operator.sql|20261020_access_site_group_review_requests.sql|20261020_access_site_reconciliations.sql|20261020_privacy_requested_url.sql|20261022_access_entitlement_admin_events.sql)
              echo "Promotion SQL must use the reviewed Render Pre-deploy runner, not this legacy workflow."
              exit 1
              ;;
          esac

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL driver
        run: pip install 'psycopg[binary]>=3.2,<4'

      - name: Run approved migration
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "PRODUCTION_DATABASE_URL secret is not configured."
            exit 1
          }
          python scripts/run_migration.py "migrations/$MIGRATION"
